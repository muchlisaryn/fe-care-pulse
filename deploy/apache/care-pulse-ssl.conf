# =============================================================================
#  care-pulse.rsijpondokkopi.com — vhost HTTPS untuk Apache (XAMPP / Windows)
# =============================================================================
#  Tujuan: melayani aplikasi lewat https. Ini BUKAN kosmetik — akses kamera
#  (scan QR rak & label) hanya diizinkan browser pada secure context, jadi tanpa
#  https tombol scan mati di semua HP.
#
#  Pemasangan: lihat README.md di folder ini.
#  Sesuaikan hanya baris ber-tanda  <<< SESUAIKAN
# =============================================================================

# Apache harus mendengarkan 443. Pada XAMPP baris ini sudah ada di
# conf/extra/httpd-ssl.conf; kalau file itu di-Include, JANGAN diaktifkan di sini
# (Listen ganda = Apache gagal start).
#Listen 443

# -----------------------------------------------------------------------------
#  Port 80 — hanya untuk (a) tantangan Let's Encrypt, (b) redirect ke https
# -----------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName care-pulse.rsijpondokkopi.com

    # PENTING: aplikasi ini di-proxy ke Next.js, jadi tanpa pengecualian di bawah
    # permintaan /.well-known/acme-challenge/... ikut diteruskan ke Next dan
    # dijawab 404 → validasi sertifikat SELALU gagal. Dua baris ini yang bikin
    # win-acme bisa memperbarui sertifikat sendiri tiap 60 hari.
    ProxyPass /.well-known/acme-challenge/ !
    Alias /.well-known/acme-challenge/ "C:/acme-webroot/.well-known/acme-challenge/"   # <<< SESUAIKAN
    <Directory "C:/acme-webroot/.well-known/acme-challenge/">                          # <<< SESUAIKAN
        Require all granted
        Options None
    </Directory>

    # Sisanya dilempar ke https.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

# -----------------------------------------------------------------------------
#  Port 443 — vhost utama, reverse proxy ke Next.js (next start, port 3000)
# -----------------------------------------------------------------------------
<VirtualHost *:443>
    ServerName care-pulse.rsijpondokkopi.com

    SSLEngine on
    # Berkas hasil win-acme (--store pemfiles). Nama berkas mengikuti hostname.
    SSLCertificateFile      "C:/ssl/pem/care-pulse.rsijpondokkopi.com-crt.pem"    # <<< SESUAIKAN
    SSLCertificateKeyFile   "C:/ssl/pem/care-pulse.rsijpondokkopi.com-key.pem"    # <<< SESUAIKAN
    SSLCertificateChainFile "C:/ssl/pem/care-pulse.rsijpondokkopi.com-chain.pem"  # <<< SESUAIKAN

    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES
    SSLHonorCipherOrder off

    # Next.js perlu tahu skema aslinya https — tanpa ini tautan/redirect yang
    # dibuat di sisi server bisa balik menunjuk ke http.
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # Timeout agak longgar: sebagian laporan CSSD memang lama diproses.
    ProxyTimeout 300

    ErrorLog  "logs/care-pulse-ssl-error.log"
    CustomLog "logs/care-pulse-ssl-access.log" common
</VirtualHost>
